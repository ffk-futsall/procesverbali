function clockButtons(){if(data.phase==='setup')return '<button class="btn btn-start" data-action="start-first">Fillo pjesën e parë</button>';if(data.phase==='first')return '<button class="btn btn-stop" data-action="finish-first">Përfundo pjesën e parë</button>';if(data.phase==='halftime')return '<button class="btn btn-start" data-action="start-second">Fillo pjesën e dytë</button>';if(data.phase==='second')return '<button class="btn btn-stop" data-action="finish-second">Përfundo pjesën e dytë</button>';if(data.phase==='after_second'){const tied=Number(data.liveScore.a)===Number(data.liveScore.b);if(isCup())return tied?'<button class="btn btn-start" data-action="start-extra">Vazhdo kohën shtesë (extra time)</button>':'<button class="btn btn-stop" data-action="finish-match">Përfundo ndeshjen</button>';return '<button class="btn btn-light" data-action="start-extra">Fillo kohën shtesë</button><button class="btn btn-stop" data-action="finish-match">Përfundo ndeshjen</button>'}if(data.phase==='extra')return '<button class="btn btn-stop" data-action="finish-extra">Përfundo kohën shtesë</button>';if(data.phase==='after_extra'){const tied=Number(data.liveScore.a)===Number(data.liveScore.b);if(isCup()&&tied)return '<button class="btn btn-start" data-action="start-penalties">Vazhdo te penalltitë</button>';return '<button class="btn btn-stop" data-action="finish-match">Përfundo ndeshjen</button>'}if(data.phase==='penalties')return `<button class="btn btn-stop" data-action="finish-match" ${penaltiesDecided()?'':'disabled'}>Përfundo ndeshjen</button>`;return '<span class="finished-label">Ndeshja përfundoi</span>'}
function penGoals(side){return data.penalties[side].filter(x=>x==='goal').length}
function penaltiesDecided(){const na=data.penalties.a.length,nb=data.penalties.b.length,ga=penGoals('a'),gb=penGoals('b');if(na>=5&&nb>=5)return na===nb&&ga!==gb;return ga>gb+(5-nb)||gb>ga+(5-na)}
function syncPenScores(){data.scores.penalties={a:String(penGoals('a')),b:String(penGoals('b'))}}
function penaltyPanelHtml(){const n=Math.max(5,data.penalties.a.length+(data.penalties.a.length>=5&&data.penalties.a.length===data.penalties.b.length&&penGoals('a')===penGoals('b')?1:0),data.penalties.b.length);const done=penaltiesDecided()||data.phase==='finished';const team=side=>{const arr=data.penalties[side];return `<div class="pen-team"><h3>${esc(data.teams[side].name||'Skuadra '+side.toUpperCase())} <b>${penGoals(side)}</b></h3><div class="pen-circles">${Array.from({length:n},(_,i)=>`<span class="pen-circle ${arr[i]==='goal'?'goal':arr[i]==='miss'?'miss':''}">${arr[i]==='goal'?ICON.check:arr[i]==='miss'?ICON.x:i+1}</span>`).join('')}</div>${data.phase==='penalties'?`<div class="pen-btns"><button type="button" class="pen-mini goal" data-action="pen" data-side="${side}" data-result="goal" title="Gol" ${done?'disabled':''}></button><button type="button" class="pen-mini miss" data-action="pen" data-side="${side}" data-result="miss" title="Humbi" ${done?'disabled':''}></button><button type="button" class="btn btn-light btn-small" data-action="pen-undo" data-side="${side}">Zhbëj</button></div>`:''}</div>`};return `<section class="pen-panel"><div class="live-section-head"><h2>Penalltitë</h2><p>Klikoni të gjelbrën nëse shënohet gol, të kuqen nëse nuk shënohet.</p></div><div class="pen-grid">${team('a')}${team('b')}</div></section>`}
function currentHalfKey(){return ['second','after_second','extra','after_extra','penalties'].includes(data.phase)?'p2':'p1'}
function scorersOf(side){return data.timeline.filter(e=>e.kind==='goal'&&e.team===side&&e.period!=='Penallti').sort((x,y)=>Number(x.minute)-Number(y.minute))}
function scorersHtml(){return `<section class="scorers-card"><div class="live-section-head"><div><h2>Golashënuesit</h2><p>Golat e regjistruara për secilën skuadër.</p></div></div><div class="scorers-grid">${['a','b'].map(side=>{const list=scorersOf(side);return `<div class="scorers-team"><h3>${esc(data.teams[side].name||'Skuadra '+side.toUpperCase())} <span>${list.length}</span></h3>${list.length?`<ul>${list.map(e=>`<li><b>${esc(e.minute||'')}'</b> <span>${/^\d+$/.test(e.shirtNo||'')?'#'+esc(e.shirtNo)+' ':''}${esc(e.playerName||'Pa emër')}</span><i>${esc(e.period||'')}</i></li>`).join('')}</ul>`:'<div class="roster-empty">Nuk ka gola ende.</div>'}</div>`}).join('')}</div></section>`}
function scorersPrintHtml(){if(!['a','b'].some(sd=>scorersOf(sd).length))return '';return `<div class="scorers-print"><div class="note-heading"><b>Golashënuesit</b></div><div class="sp-grid">${['a','b'].map(side=>`<div><b>${esc(data.teams[side].name||'Skuadra '+side.toUpperCase())}</b>${scorersOf(side).map(e=>`<div>${esc(e.minute||'')}' · ${/^\d+$/.test(e.shirtNo||'')?'#'+esc(e.shirtNo)+' ':''}${esc(e.playerName||'Pa emër')}</div>`).join('')||'<div>—</div>'}</div>`).join('')}</div></div>`}
function teamStatsHtml(){return `<section class="team-stats">${['a','b'].map(side=>{const name=data.teams[side].name||'Skuadra '+side.toUpperCase(),f1=data.fouls[side].p1.filter(Boolean).length,f2=data.fouls[side].p2.filter(Boolean).length,cards=data.timeline.filter(e=>e.kind==='card'&&e.team===side).sort((x,y)=>Number(x.minute||0)-Number(y.minute||0)),yellow=cards.filter(e=>!String(e.sourceRow||'').startsWith('kk')),red=cards.filter(e=>String(e.sourceRow||'').startsWith('kk')),chip=e=>`<span class="card-chip ${String(e.sourceRow||'').startsWith('kk')?'red':'yellow'}"><i></i>${/^\d*$/.test(e.shirtNo||'')?'#':''}${esc(e.shirtNo||'—')} ${esc(e.playerName||'')} · ${esc(e.minute||'')}'${e.shift?' · shif '+esc(e.shift):''}</span>`;return `<div class="ts-card"><h3>${esc(name)}</h3><div class="ts-row"><span>Faullat</span><b class="${f1>=5?'bonus':f1===4?'warn4':''}">P1: ${f1}</b><b class="${f2>=5?'bonus':f2===4?'warn4':''}">P2: ${f2}</b></div><div class="ts-row"><span>Kartonat</span><b><i class="sq yellow"></i> ${yellow.length}</b><b><i class="sq red"></i> ${red.length}</b></div>${cards.length?`<div class="player-chips ts-chips">${cards.map(chip).join('')}</div>`:'<div class="roster-empty">Nuk ka karton.</div>'}</div>`}).join('')}</section>`}
function clockSubline(){if(data.phase==='first')return 'Minuta e pjesës së parë · vazhdon deri te përfundimi';if(data.phase==='second')return 'Minuta e pjesës së dytë · vazhdon deri te përfundimi';if(data.phase==='extra')return 'Koha shtesë · ora vazhdon';if(data.phase==='halftime')return `Pjesa e parë: ${esc(data.scores.first.a||'0')} : ${esc(data.scores.first.b||'0')}`;if(data.phase==='setup')return 'Gati për të nisur';if(data.phase==='penalties')return `Penalltitë: ${penGoals('a')} : ${penGoals('b')}`;return phases[data.phase]||''}
function currentElapsed(){return Math.max(0,Number(data.clock.elapsedMs||0)+(data.clock.running&&data.clock.startedAt?Date.now()-Number(data.clock.startedAt):0))}
function formatClock(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60);return `${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function calculatedMatchDurationMs(){const stored=Number(data.clock.matchDurationMs||0);if(Number.isFinite(stored)&&stored>0)return stored;const started=Number(data.clock.matchStartedAt||0),ended=Number(data.clock.matchEndedAt||0);if(started&&ended)return Math.max(0,ended-started);return Math.max(0,Number(data.clock.firstElapsedMs||0)+Number(data.clock.secondElapsedMs||0)+Number(data.clock.extraElapsedMs||0))}
function matchDurationLabel(){if(data.phase!=='finished'&&!data.clock.matchEndedAt)return '';const minutes=Math.floor(calculatedMatchDurationMs()/60000);return minutes===1?'1 minutë':`${minutes} minuta`}
function updateClockDisplay(){const clock=$('#gameClock');if(clock)clock.textContent=formatClock(currentElapsed());const caption=$('#phaseCaption');if(caption)caption.textContent=phases[data.phase]||'Ndeshja nuk ka filluar';const sub=$('#clockSub');if(sub)sub.textContent=clockSubline();const wizard=$('#wizardClock');if(wizard)wizard.textContent=data.clock.running?`Koha po ecën: ${formatClock(currentElapsed())} · ${phases[data.phase]}`:'Plotësoni faqet njëra pas tjetrës.';const minute=$('#currentMinute');if(minute)minute.textContent=`Minuta e ndeshjes: ${currentMatchMinute()}`}
function currentMatchMinute(){const elapsed=Math.ceil(currentElapsed()/60000),base=['second','after_second'].includes(data.phase)?20:['extra','after_extra','penalties'].includes(data.phase)?40:0;return base+elapsed}
function currentPeriod(){const p=data.phase;return p==='penalties'?'Penallti':(p==='second'||p==='after_second')?'P2':(p==='extra'||p==='after_extra')?'Ext. Time':'P1'}
function eventTitle(e){return {goal:'Gol',card:String(e.sourceRow||'').startsWith('kk')?'Karton i kuq':'Karton i verdhë',substitution:'Zëvendësim',foul:'Faul',timeout:'Time-out',note:'Shënim'}[e.kind]||'Ngjarje'}
function eventDescription(e){const team=data.teams[e.team]?.name||`Skuadra ${(e.team||'').toUpperCase()}`;if(e.kind==='goal')return `${team} · #${e.shirtNo||'—'} ${e.playerName||''} · rezultati ${e.scoreAfter||''}`;if(e.kind==='card')return `${team} · ${/^\d*$/.test(e.shirtNo||'')?'#':''}${e.shirtNo||'—'} ${e.playerName||''} ${e.shift?' · shifra '+e.shift:''}`;if(e.kind==='substitution')return `${team} · del #${e.shirtOut||'—'}${e.outgoingName?' '+e.outgoingName:''} · hyn #${e.shirtIn||'—'}${e.incomingName?' '+e.incomingName:''}`;if(e.kind==='foul')return `${team} · ${e.period==='P2'?'Pjesa e dytë':'Pjesa e parë'}`;if(e.kind==='timeout')return `${team} · Time-out · ${e.period==='P2'?'P2':'P1'}`;return e.note||e.playerName||''}
function rosterLiveHtml(side){const players=data.teams[side].players.filter(p=>p.name||p.shirtNo);if(!players.length)return '<div class="roster-empty">Lojtarët shtohen te “Edito ndeshjen”.</div>';return `<div class="player-chips">${players.map(p=>`<span class="player-chip"><b>#${esc(p.shirtNo||'—')}</b>${esc(p.name||'Pa emër')}</span>`).join('')}</div>`}
function isRedBlocked(side,shirt,name,exceptId){const s=String(shirt||'').trim().toLowerCase(),n=String(name||'').trim().toLowerCase();return data.timeline.some(e=>e.kind==='card'&&e.team===side&&String(e.sourceRow||'').startsWith('kk')&&e.id!==exceptId&&((s&&String(e.shirtNo||'').trim().toLowerCase()===s)||(n&&String(e.playerName||'').trim().toLowerCase()===n)))}
function officialCode(role){const r=String(role||'').trim();const m={'Përfaqësuesi':'PËR','Trajneri':'TR','Nd.Trajneri':'ND.TR','Tr.Portierave':'TR.P','Mjeku':'MJ','Fizioterapeuti':'FIZ'};return m[r]||r.slice(0,3).toUpperCase()}

function playerOptions(side,selected='',withOfficials=false){const players=data.teams[side].players.map((p,i)=>p.shirtNo||p.name?`<option value="${i}" ${String(i)===String(selected)?'selected':''} ${isRedBlocked(side,p.shirtNo,p.name,modalEventId)?'disabled':''}>#${esc(p.shirtNo||'—')} · ${esc(p.name||'Lojtar')}${isRedBlocked(side,p.shirtNo,p.name,modalEventId)?' · KARTON I KUQ':''}</option>`:'').join('');return `<option value="manual" ${selected==='manual'?'selected':''}>Shkruaj manualisht</option>${players}${withOfficials?officialOptions(side):''}`}
function currentGoalSlot(existing){if(existing?.goalIndex!==undefined&&existing.goalIndex>=0)return existing.goalIndex;return data.goals.findIndex(g=>!g.team&&!g.shirtNo&&!g.minute)}
function renderEventModal(kind,existing=null,presetSide=null){modalEventId=existing?.id||null;const side=existing?.team||presetSide||'a',minute=existing?.minute??currentMatchMinute(),period=existing?.period||currentPeriod(),teamSelect=`<label class="field"><span>Skuadra</span><select name="team" id="eventTeam"><option value="a" ${side==='a'?'selected':''}>${esc(data.teams.a.name||'Skuadra A')} · Skuadra A (vendase)</option><option value="b" ${side==='b'?'selected':''}>${esc(data.teams.b.name||'Skuadra B')} · Skuadra B</option></select></label>`,shirt=existing?.shirtNo||'',name=existing?.playerName||'';let body='';if(kind==='goal')body=`${teamSelect}<label class="field"><span>Lojtari nga lista</span><select id="playerChoice">${playerOptions(side,existing?.playerIndex??'manual')}</select></label><div class="form-grid cols-2">${modalField('Nr. fanellës','shirtNo',shirt,'number',1,99)}${modalField('Golashënuesi','playerName',name,'text')} ${modalField('Minuta','minute',minute,'number',0,120)}<label class="field"><span>Pjesa</span><select name="period">${['P1','P2','Ext. Time','Penallti'].map(x=>`<option ${period===x?'selected':''}>${x}</option>`).join('')}</select></label></div><p class="hint">Penalltitë e ekzekutimit regjistrohen veçmas dhe nuk shtohen te rezultati i ndeshjes.</p>`;else if(kind==='card')body=`${teamSelect}<div class="form-grid cols-2">${modalPlayerControls(existing,side)}${modalField('Minuta','minute',minute,'number',0,120)}<label class="field"><span>Lloji i kartonit</span><select name="cardType"><option value="yellow" ${String(existing?.sourceRow||'').startsWith('kk')?'':'selected'}>Karton i verdhë</option><option value="red" ${String(existing?.sourceRow||'').startsWith('kk')?'selected':''}>Karton i kuq</option></select></label><label class="field"><span>Shifra (numër)</span><input name="shift" type="number" min="0" max="99" step="1" value="${esc(existing?.shift||'')}"></label></div>`;else if(kind==='substitution')body=`${teamSelect}<div class="form-grid cols-2">${modalField('Fanella që del','shirtOut',existing?.shirtOut||'','number',1,99)}${modalField('Emri i lojtarit që del','outgoingName',existing?.outgoingName||'','text')}${modalField('Fanella që hyn','shirtIn',existing?.shirtIn||'','number',1,99)}${modalField('Emri i lojtarit që hyn','incomingName',existing?.incomingName||'','text')}${modalField('Minuta','minute',minute,'number',0,120)}<label class="field"><span>Rreshti i protokollit</span><select name="sourceRow">${Object.entries(disciplineRows).map(([k,v],i)=>`<option value="${k}" ${existing?.sourceRow===k?'selected':''}>${esc(v)} · rreshti ${i+1}</option>`).join('')}</select></label></div>`;else if(kind==='foul')body=`${teamSelect}<div class="form-grid cols-2"><label class="field"><span>Pjesa</span><select name="period">${['P1','P2'].map(x=>`<option ${(period==='P1'?'P1':'P2')===x?'selected':''}>${x}</option>`).join('')}</select></label></div>`;else if(kind==='timeout')body=`${teamSelect}<div class="form-grid cols-2">${modalField('Minuta','minute',minute,'number',0,120)}<label class="field"><span>Pjesa</span><select name="period">${['P1','P2'].map(x=>`<option ${(period==='P1'?'P1':'P2')===x?'selected':''}>${x}</option>`).join('')}</select></label></div>`;else body=`${teamSelect}${modalField('Shënimi','note',existing?.note||'','textarea',null,null,true)}`;const title={goal:'Shto gol',card:'Shto karton',substitution:'Shto zëvendësim',foul:'Regjistro faul',timeout:'Regjistro time-out',note:'Shto shënim'}[kind];$('#modalRoot').innerHTML=`<div class="modal-backdrop"><form class="event-modal" id="eventForm"><div class="modal-head"><h2>${existing?'Edito ngjarjen':title}</h2><button type="button" class="icon-close" data-action="close-modal">${ICON.x}</button></div><div class="modal-body">${body}</div><div class="modal-actions"><button type="button" class="btn btn-light" data-action="close-modal">Anulo</button><button class="btn btn-primary" type="submit">Ruaj ngjarjen</button></div></form></div>`;const playerChoice=$('#playerChoice');if(playerChoice){playerChoice.addEventListener('change',()=>selectPlayer(playerChoice,$('#eventTeam')?.value||side));$('#eventTeam').addEventListener('change',()=>{const s=$('#eventTeam').value;playerChoice.innerHTML=playerOptions(s,'manual',kind==='card')})}$('#eventTeam')?.addEventListener('change',()=>{const s=$('#eventTeam').value,select=$('#playerChoice');if(select)select.innerHTML=playerOptions(s,'manual',kind==='card')});$('#eventForm').addEventListener('submit',e=>{e.preventDefault();saveEvent(kind,existing,e.currentTarget)})}
function modalField(label,name,value,type='text',min=null,max=null,full=false){const cls=full?'full':'';const input=type==='textarea'?`<textarea name="${name}" rows="3">${esc(value)}</textarea>`:`<input name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?`min="${min??0}" max="${max??999}" step="1" required`:''} ${type==='text'&&name==='playerName'?'':''}>`;return `<label class="field ${cls}"><span>${label}</span>${input}</label>`}
function modalPlayerControls(existing,side){return `<div class="field"><span>Lojtari ose zyrtari nga lista</span><select id="playerChoice">${playerOptions(side,'manual',true)}</select><div class="form-grid cols-2 space-top-12"><label class="field"><span>Nr. fanellës / kodi</span><input name="shirtNo" type="text" maxlength="8" value="${esc(existing?.shirtNo||'')}"></label>${modalField('Emri','playerName',existing?.playerName||'','text')}</div></div>`}
function selectPlayer(select,side){const choice=select.value,form=$('#eventForm');if(choice==='manual')return;if(String(choice).startsWith('o')){const o=data.teams[side].officials?.[Number(String(choice).slice(1))];if(!o)return;form.elements.shirtNo.value=officialCode(o.role);form.elements.playerName.value=o.name||'';return}const p=data.teams[side].players[Number(choice)];if(!p)return;form.elements.shirtNo.value=p.shirtNo;form.elements.playerName.value=p.name}
function saveEvent(kind,existing,form){const fd=new FormData(form),f=Object.fromEntries(fd.entries()),team=f.team||existing?.team||'a';let ev={...(existing||{}),id:existing?.id||`ev-${Date.now()}-${Math.random().toString(16).slice(2)}`,kind,team,minute:String(f.minute||currentMatchMinute()),period:String(f.period||currentPeriod()),note:String(f.note||''),sourceRow:String(f.sourceRow||''),shift:String(f.shift||'')};if(kind==='goal'||kind==='card'){ev.shirtNo=String(f.shirtNo||'');ev.playerName=String(f.playerName||'');if(kind==='card'){ev.sourceRow=f.cardType==='red'?(team==='b'?'kkB':'kkA'):(team==='b'?'kvB2':'kvB1');ev.shift=String(f.shift||'')}if(kind==='goal'){ev.addedTime='';ev.goalIndex=currentGoalSlot(existing)}}if(kind==='substitution'){ev.shirtOut=String(f.shirtOut||'');ev.shirtIn=String(f.shirtIn||'');ev.outgoingName=String(f.outgoingName||'');ev.incomingName=String(f.incomingName||'');ev.shirtNo=ev.shirtOut;ev.shift=ev.shirtIn}if((kind==='goal'||kind==='card')&&isRedBlocked(team,ev.shirtNo,ev.playerName,existing?.id)){toast('Ky lojtar ka karton të kuq dhe nuk mund të regjistrohet më (gol ose karton).');return}if(existing)removeEffect(existing);if(kind==='goal'&&ev.goalIndex<0){toast('Janë plotësuar të gjitha vendet e golave në protokoll.');return}if(kind==='card'||kind==='substitution'){const slots=data.discipline[ev.sourceRow];if(!slots){toast('Zgjidhni rreshtin e protokollit.');return}ev.slot=existing?.sourceRow===ev.sourceRow?existing.slot:slots.findIndex(x=>!x.shirtNo&&!x.minute&&!x.shift);if(ev.slot<0){toast('Ky rresht i protokollit është plot.');return}}if(kind==='foul'){const h=ev.period==='P2'?'p2':'p1';ev.slot=existing?.period===ev.period&&existing?.team===team?existing.slot:data.fouls[team][h].findIndex(x=>!x);if(ev.slot<0){toast('Nuk ka më vende për faula në këtë pjesë.');return}}applyEffect(ev);if(existing){const idx=data.timeline.findIndex(x=>x.id===existing.id);if(idx>=0)data.timeline[idx]=ev}else data.timeline.push(ev);$('#modalRoot').innerHTML='';persist();renderLive();const fc=kind==='foul'?data.fouls[team][ev.period==='P2'?'p2':'p1'].filter(Boolean).length:0;if(kind==='foul'&&!existing&&fc>=5)toast(`${data.teams[team].name||'Skuadra '+team.toUpperCase()}: ${fc} faulle në ${ev.period==='P2'?'P2':'P1'} — skuadra është në BONUS për faulle!`,true);else toast(existing?'Ngjarja u përditësua.':'Ngjarja u shtua.')}
function adjustScore(period,side,amount){const cur=Number(data.scores[period][side]||0);data.scores[period][side]=String(Math.max(0,cur+amount));if(period!=='penalties'){data.liveScore[side]=Math.max(0,Number(data.liveScore[side]||0)+amount);if(data.phase==='finished')data.scores.final[side]=String(data.liveScore[side])}}
function applyEffect(e){if(e.kind==='goal'){const period={'P1':'first','P2':'second','Ext. Time':'extra','Penallti':'penalties'}[e.period]||'first';adjustScore(period,e.team,1);if(e.goalIndex>=0){data.goals[e.goalIndex]={team:e.team,shirtNo:e.shirtNo,scorerName:e.playerName,minute:e.minute,addedTime:e.addedTime||'',period:e.period,score:`${data.liveScore.a}:${data.liveScore.b}`}}}if(e.kind==='card'||e.kind==='substitution'){const cell=data.discipline[e.sourceRow]?.[e.slot];if(cell){cell.shirtNo=e.kind==='substitution'?e.shirtOut:e.shirtNo;cell.minute=e.minute;cell.shift=e.kind==='substitution'?e.shirtIn:e.shift||''}}if(e.kind==='foul'){const side=e.team==='b'?'b':'a',h=e.period==='P2'?'p2':'p1';if(e.slot>=0)data.fouls[side][h][e.slot]=String(e.minute)}if(e.kind==='timeout'){const h=e.period==='P2'?'second':'first';data.timeouts[h][e.team]=e.minute}if(e.kind==='note'){const lines=(data.notes.incidents||'').split('\n').filter(Boolean);lines.push(e.note);data.notes.incidents=lines.join('\n')}}
function removeEffect(e){if(e.kind==='goal'){const p={'P1':'first','P2':'second','Ext. Time':'extra','Penallti':'penalties'}[e.period]||'first';adjustScore(p,e.team,-1);if(e.goalIndex>=0)data.goals[e.goalIndex]={team:'',shirtNo:'',scorerName:'',minute:'',addedTime:'',period:'',score:''}}if(e.kind==='card'||e.kind==='substitution'){if(data.discipline[e.sourceRow]?.[e.slot])data.discipline[e.sourceRow][e.slot]=blankEvent()}if(e.kind==='foul'){const h=e.period==='P2'?'p2':'p1';if(e.slot>=0)data.fouls[e.team][h][e.slot]=''}if(e.kind==='timeout'){const h=e.period==='P2'?'second':'first';if(data.timeouts[h][e.team]===e.minute)data.timeouts[h][e.team]=''}if(e.kind==='note'){const lines=(data.notes.incidents||'').split('\n').filter(Boolean);const i=lines.indexOf(e.note);if(i>=0)lines.splice(i,1);data.notes.incidents=lines.join('\n')}}
function startClock(phase){const now=Date.now();data.phase=phase;data.clock.running=true;data.clock.startedAt=now;data.clock.elapsedMs=0;if(phase==='first'){data.actualStart=hhmm(now);data.clock.matchStartedAt=now;data.clock.matchEndedAt=null;data.clock.matchDurationMs=0;data.liveScore={a:Number(data.scores.first.a||0),b:Number(data.scores.first.b||0)}}if(phase==='second'){data.liveScore={a:Number(data.scores.first.a||0)+Number(data.scores.second.a||0),b:Number(data.scores.first.b||0)+Number(data.scores.second.b||0)}}if(phase==='extra'){data.liveScore={a:Number(data.scores.first.a||0)+Number(data.scores.second.a||0)+Number(data.scores.extra.a||0),b:Number(data.scores.first.b||0)+Number(data.scores.second.b||0)+Number(data.scores.extra.b||0)}}persist();renderLive()}
function stopClock(){const elapsed=currentElapsed();data.clock.elapsedMs=elapsed;data.clock.running=false;data.clock.startedAt=null;if(data.phase==='first'){data.clock.firstElapsedMs=elapsed;data.scores.first={a:String(data.liveScore.a),b:String(data.liveScore.b)};data.phase='halftime'}else if(data.phase==='second'){data.clock.secondElapsedMs=elapsed;data.scores.second={a:String(Math.max(0,Number(data.liveScore.a)-Number(data.scores.first.a||0))),b:String(Math.max(0,Number(data.liveScore.b)-Number(data.scores.first.b||0)))};data.phase='after_second'}else if(data.phase==='extra'){data.clock.extraElapsedMs=elapsed;data.scores.extra={a:String(Math.max(0,Number(data.liveScore.a)-Number(data.scores.first.a||0)-Number(data.scores.second.a||0))),b:String(Math.max(0,Number(data.liveScore.b)-Number(data.scores.first.b||0)-Number(data.scores.second.b||0)))};data.phase='after_extra'}persist();renderLive()}
function finishMatch(){if(data.clock.running)stopClock();const endedAt=Date.now(),startedAt=Number(data.clock.matchStartedAt||0);data.phase='finished';data.clock.running=false;data.clock.matchEndedAt=endedAt;data.clock.matchDurationMs=startedAt?Math.max(0,endedAt-startedAt):Math.max(0,Number(data.clock.firstElapsedMs||0)+Number(data.clock.secondElapsedMs||0)+Number(data.clock.extraElapsedMs||0));data.scores.final={a:String(data.liveScore.a),b:String(data.liveScore.b)};persist();renderLive();toast('Ndeshja u përfundua. Rezultati dhe kohëzgjatja u ruajtën në protokoll.')}
function syncAfterEdit(){if(data.phase==='first')data.liveScore={a:Number(data.scores.first.a||0),b:Number(data.scores.first.b||0)};else if(['halftime','after_second','after_extra'].includes(data.phase))data.liveScore={a:Number(data.scores.first.a||0)+Number(data.scores.second.a||0)+(data.phase==='after_extra'?Number(data.scores.extra.a||0):0),b:Number(data.scores.first.b||0)+Number(data.scores.second.b||0)+(data.phase==='after_extra'?Number(data.scores.extra.b||0):0)};else if(data.phase==='second')data.liveScore={a:Number(data.scores.first.a||0)+Number(data.scores.second.a||0),b:Number(data.scores.first.b||0)+Number(data.scores.second.b||0)};else if(data.phase==='finished')data.liveScore={a:Number(data.scores.final.a||0),b:Number(data.scores.final.b||0)}}
function saveProtocol(){if(data.phase==='finished'){finalSave();return}try{localStorage.setItem(SAVED_KEY,JSON.stringify(data));persist();toast('Protokolli u ruajt në këtë pajisje.')}catch{toast('Ruajtja në pajisje dështoi.')}}
function resetProtocol(){if(!confirm('Reseto protokollin? Të gjitha të dhënat e ruajtura do të fshihen përfundimisht.'))return;try{sessionStorage.removeItem(SESSION_KEY);sessionStorage.removeItem(OLD_SESSION_KEY);localStorage.removeItem(SAVED_KEY)}catch{}window.__noUnload=true;location.reload()}
function protocolActionsHtml(){let saved=false;try{saved=!!localStorage.getItem(SAVED_KEY)}catch{}return `<div class="protocol-actions"><button class="btn btn-primary" data-action="save-protocol">Ruaj protokollin</button><button class="btn btn-danger" data-action="reset-protocol">Reseto protokollin</button><p class="hint">${saved?'Ruajtja automatike është aktive në këtë pajisje: çdo ndryshim ruhet vetë.':'Pasi ta ruash, të dhënat ruhen automatikisht në këtë pajisje dhe mbeten edhe pas mbylljes së faqes.'} Reseto i fshin të gjitha të dhënat.</p></div>`}
function persist(){try{sessionStorage.setItem(SESSION_KEY,JSON.stringify(data));try{if(localStorage.getItem(SAVED_KEY))localStorage.setItem(SAVED_KEY,JSON.stringify(data))}catch{}const s=$('#saveState');if(s)s.textContent='Ruajtur në këtë seancë';const err=$('#storageError');if(err)err.textContent=''}catch{const s=$('#saveState');if(s)s.textContent='Gabim në ruajtjen e përkohshme';const err=$('#storageError');if(err)err.textContent='Shfletuesi nuk lejoi ruajtjen e përkohshme. Shkarkoni ruajtjen JSON.'}}
function scheduleSave(){const s=$('#saveState');if(s)s.textContent='Duke ruajtur…';clearTimeout(saveTimer);saveTimer=setTimeout(persist,200)}
function downloadSave(){persist();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`procesverbal-${safeName(data.teams.a.name||'skuadra-a')}-${safeName(data.teams.b.name||'skuadra-b')}.json`;a.click();URL.revokeObjectURL(url);toast('Ruajtja u shkarkua. Mund ta hapni në pajisje tjetër.')}
function safeName(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'ndeshje'}
function importSave(file){const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(String(reader.result));if(!parsed||typeof parsed!=='object'||!parsed.teams||!parsed.scores)throw new Error('Skedari nuk është ruajtje e vlefshme e procesverbalit.');data=mergeData(parsed);persist();if(['setup','not_started'].includes(data.phase)){step=1;editMode=false;renderWizard()}else renderLive();toast('Procesverbali u hap.')}catch(e){toast(e.message||'Skedari nuk mund të hapet.')}};reader.readAsText(file)}

function printPreview(){if(!validateBeforePreview())return;const root=document.createElement('div');root.className='print-root preview-open';root.innerHTML=`<div class="preview-screen"><div class="preview-toolbar no-print"><span class="label">Parapamja · A4 · 2 faqe · </span><button class="btn btn-light" data-action="back-live">Kthehu</button></div>${printRootHtml()}</div>`;$('.print-root')?.remove();app.append(root);$('.app-shell').style.display='none';currentView='preview';fitPreview();window.scrollTo(0,0)}
function escU(v){return esc(String(v==null?'':v).toUpperCase())}
function printInput(v){return `<span class="fill">${escU(v)}</span>`}
function formatDateTime(){if(!data.matchDate)return data.startTime;const date=new Date(`${data.matchDate}T12:00:00Z`),weekdayNames=['e dielë','e hënë','e martë','e mërkurë','e enjte','e premte','e shtunë'],raw=weekdayNames[date.getUTCDay()],name=raw.slice(2),week=name.charAt(0).toLocaleUpperCase('sq-AL')+name.slice(1),[y,m,d]=data.matchDate.split('-');return `E ${week} / ${d}.${m}.${y}${data.startTime?` / ${data.startTime}`:''}`}
function displayId(v,prefix='ID:'){if(!v)return '';return /^id(?:\s|:|-|#)/i.test(v)?v:`${prefix}${v}`}
function printStaff(side){return data.teams[side].officials.map(o=>`<tr><th>${esc(o.role)}</th><td>${printInput(o.name)}</td><td>${printInput(displayId(o.idNumber,'Id:'))}</td></tr>`).join('')}
function printPageOne(){const top=`<div class="topbox"><div class="grid ident"><div class="cell"><label>Java</label><strong>${(()=>{const st=isCup()?String(data.cupStage||'').trim():'';const r=String(data.round||'').trim();const v=st?(r?r+' · '+st:st):r;return v.length>14?`<span style="font-size:5pt">${printInput(v)}</span>`:v.length>8?`<span style="font-size:6pt">${printInput(v)}</span>`:printInput(v)})()}</strong></div><div class="cell"><label>Kompeticioni</label><strong>${(()=>{const v=competitionLabel();return v.length>22?`<span style="font-size:6pt">${printInput(v)}</span>`:printInput(v)})()}</strong></div><div class="cell"><label>Data dhe ora</label><strong>${printInput(formatDateTime())}</strong></div><div class="cell"><label>Palestra / Qyteti</label><strong>${(()=>{const v=[data.venue,data.city].map(x=>String(x||'').trim()).filter(Boolean).join(', ');return v.length>30?`<span style="font-size:6pt">${printInput(v)}</span>`:printInput(v)})()}</strong></div></div><div class="grid admin"><div class="cell"><label>Organizimi ndeshjes</label>${printInput(data.organization)}</div><div class="cell"><label>Përgjegjësit e sigurisë</label><div class="split">${printInput(data.securityName)}<span>${escU(displayId(data.securityId,'ID:'))}</span></div></div><div class="cell"><label>Fillimi ndeshjes</label>${printInput(actualStartStr())}</div><div class="cell"><label>Kohëzgjatja</label>${printInput(matchDurationLabel())}</div><div class="cell"><label>Përfundimi ndeshjes</label>${printInput(matchEndStr())}</div><div class="cell"><label>Numri tifozëve</label>${printInput(data.attendance)}</div></div></div>`;const team=s=>`<div class="teamlarge ${s}"><div class="teamname">${printInput(data.teams[s].name)}</div><div class="kit">${[['Qorapet',data.teams[s].kit.socks],['Shorcet',data.teams[s].kit.shorts],['Maica',data.teams[s].kit.shirt]].map(([l,v])=>`<div>${l}:<br><span class="fill kitv${String(v||'').length>16?' long':''}">${escU(v)}</span></div>`).join('')}</div></div>`;const <script>/* === Eksporti i protokollit në PDF: Dërgo / Shkarko === */
(function(){

    var html='<!doctype html><html><head><meta charset="utf-8"><style>'+css+'</style></head><body><div class="print-root preview-open"><div class="preview-screen">'+printRootHtml()+'</div></div></body></html>';

      await loaded;
      var d=f.contentDocument;
      if(d.fonts&&d.fonts.ready)try{await d.fonts.ready}catch(e){}

        if(i>0)pdf.addPage('a4','portrait');

      if(navigator.canShare&&navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:'Procesverbal FFK Futsal',text:(data.teams.a.name||'')+' - '+(data.teams.b.name||'')});
        return
      }
    }catch(e){if(e&&e.name==='AbortError')return}
    downloadFile(file);
    toast('Kjo pajisje nuk lejon ndarjen direkt. Protokolli u shkarkua — dërgojeni nga skedari i shkarkuar.',true)
  }
  function openExportModal(){
    closeModal();
    var m=document.createElement('div');m.id='pdfModal';m.className='modal-backdrop center';
    m.innerHTML='<div class="event-modal pdf-modal" role="dialog" aria-modal="true" aria-labelledby="pdfTitle"><div class="modal-head"><h2 id="pdfTitle">Protokolli</h2><button type="button" class="icon-close" data-pdf="close" aria-label="Mbyll"><svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="modal-body"><p class="hint" id="pdfMsg">Duke përgatitur PDF-në…</p><div class="pdf-choices"><button type="button" class="btn btn-primary" data-pdf="send" disabled>Dërgo Protokollin</button><button type="button" class="btn btn-light" data-pdf="download" disabled>Shkarko Protokollin</button></div><p class="hint pdf-sub">Dërgo: zgjidhni Viber, WhatsApp, Email, Messenger etj. Shkarko: PDF ruhet në këtë pajisje.</p></div></div>';
    document.body.appendChild(m);
    var msg=m.querySelector('#pdfMsg'),btns=m.querySelectorAll('[data-pdf="send"],[data-pdf="download"]'),file=null;
    m.addEventListener('click',function(ev){
      var b=ev.target.closest('[data-pdf]');
      if(!b){if(ev.target===m)closeModal();return}
      var k=b.dataset.pdf;
      if(k==='close')closeModal();
      else if(k==='retry')openExportModal();
      else if(file&&k==='send')shareFile(file);
      else if(file&&k==='download'){downloadFile(file);toast('Protokolli u shkarkua në këtë pajisje.')}
    });
    getPdf().then(function(f){file=f;msg.textContent='PDF është gati. Çfarë dëshironi të bëni?';btns.forEach(function(b){b.disabled=false})})
      .catch(function(e){msg.innerHTML='Nuk u krijua PDF-ja. <button type="button" class="btn btn-light btn-small" data-pdf="retry">Provo përsëri</button>';console.error(e)});
  }
  var st=document.createElement('style');
  st.textContent='.pdf-modal{max-width:440px}.pdf-choices{display:grid;gap:10px;margin:14px 0 8px}.pdf-choices .btn{width:100%;min-height:50px;font-size:16px}.pdf-choices .btn[disabled]{opacity:.5;cursor:wait}.pdf-sub{font-size:12px;margin-top:6px}';
  document.head.appendChild(st);
  var __a2=action;
  action=function(name,button){
    if(name==='export-pdf'){openExportModal();return}
    if(name==='save-protocol'&&data.phase==='finished')name='final-save';
    if(name==='final-save'){
      __a2(name,button);
      if(data.locked)openExportModal();
      return
    }
    return __a2(name,button)
  };
  var __fs=finalSaveHtml;
  finalSaveHtml=function(){var h=__fs.apply(this,arguments);return data.locked?h.replace('</div>','<button type="button" class="btn btn-primary" data-action="export-pdf">Dërgo / Shkarko protokollin</button></div>'):h};
  var __ss=sideSaveHtml;
  sideSaveHtml=function(){var h=__ss.apply(this,arguments);return data.locked?'<button class="btn btn-light" data-action="export-pdf">Dërgo / Shkarko</button>'+h:h};
})();
</script>
